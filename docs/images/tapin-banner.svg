<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Tapin — connect every branch</title>
<desc id="desc">Dark violet banner with an abstract network of shipping locations. Decorative illustration, not a screenshot or geographic map.</desc>
