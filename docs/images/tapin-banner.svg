<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b5a2ff" stroke-opacity=".055"/></pattern>
<g id="pin"><path d="M0 20C-5 13-15 3-15-7a15 15 0 0 1 30 0C15 3 5 13 0 20Z" fill="currentColor"/><circle cy="-7" r="5" fill="#151329"/></g>
</defs>
